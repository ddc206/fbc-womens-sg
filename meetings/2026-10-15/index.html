                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);

            .staticrypt-form input[type="password"],

                background: inherit;

                font-size: 14px;

            .staticrypt-password-container {

                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #b5566e;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #b5566e;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #fbf1f3;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            /* FBC Women's SG: match the home page's next-meeting card. */
            .staticrypt-content {
                background: #ffffff;
                font-family: "Nunito Sans", system-ui, sans-serif;
                color: #3a2f33;
            }
            .staticrypt-page { width: min(400px, calc(100% - 2rem)); padding: 14vh 0 0; }
            .staticrypt-form {
                max-width: none;
                padding: 2.75rem 2rem 2.25rem;
                border: 1px solid #ecd0d8;
                border-radius: 24px;
                background: linear-gradient(180deg, #ffffff, #fbf1f3);
                box-shadow: 0 12px 32px rgba(143, 63, 85, 0.12);
                overflow: hidden;
            }
            .staticrypt-form::before {
                content: "";
                position: absolute;
                top: 0; left: 0; right: 0;
                height: 6px;
                background: #b5566e;
            }
            .staticrypt-hr { display: none; }
            .staticrypt-instructions { margin: 0 0 1.5rem; }
            .staticrypt-title {
                font-family: "Lora", Georgia, serif;
                font-weight: 600;
                font-size: 1.9rem;
                color: #8f3f55;
                margin: 0 0 0.5rem;
            }
            .staticrypt-instructions p:last-child { margin: 0; color: #7a6a70; }
            .staticrypt-password-container {
                background: #ffffff;
                border: 1px solid #e3d3d8;
                border-radius: 12px;
                margin-bottom: 1rem;
                overflow: hidden;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] { background: #ffffff; }
            .staticrypt-password-container:focus-within { border-color: #b5566e; }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] { font-family: inherit; font-size: 16px; padding: 14px 44px 14px 16px; }

                font-size: 1rem;
                font-weight: 700;
                padding: 0.8rem 1.5rem;

                    sessionStorage.removeItem("sg-just-signed-in");
                    alert(templateError);
                }
            });
        </script>
